# Single target. riscv64imac: no hardware float, lp64 ABI.
#
# The linker script path is relative to the workspace root, which is where
# cargo runs from. rust-lld is the default linker for this target and needs no
# external toolchain.

[build]
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=medium",
    "-C", "link-arg=-Tboot/link.ld",
    "-C", "link-arg=--gc-sections",
]

[alias]
kb = "build --release"
kc = "check"